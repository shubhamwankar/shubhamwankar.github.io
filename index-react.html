<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shubham Wankar | Senior data scientist</title>
<meta name="description" content="Senior data scientist with 9+ years of experience, turning messy data into insights and impact.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1117;--panel:#141b24;--line:#243040;--text:#e8edf3;--muted:#8d9aac;--blue:#6aa5ff;--amber:#ffb454}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f7fa;--panel:#fff;--line:#d9e0e8;--text:#0e1620;--muted:#566377;--blue:#1f6feb;--amber:#c77700}}
:root[data-theme="light"]{--bg:#f5f7fa;--panel:#fff;--line:#d9e0e8;--text:#0e1620;--muted:#566377;--blue:#1f6feb;--amber:#c77700}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.6 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.12;margin:0}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
section{padding:84px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(1.7rem,3.4vw,2.3rem);margin-bottom:36px}
p{max-width:64ch;margin:0 0 1em}
#bar{position:fixed;top:0;left:0;height:3px;width:100%;background:linear-gradient(90deg,var(--amber),var(--blue));transform-origin:left;transform:scaleX(0);z-index:9}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;gap:22px;height:58px}
nav .name{font:700 1.05rem "Bricolage Grotesque",sans-serif;color:var(--text);text-decoration:none;margin-right:auto}
nav a{color:var(--muted);text-decoration:none;font-size:.95rem}
nav a:hover{color:var(--text)}
#theme{background:none;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 12px;font:inherit;font-size:.9rem;cursor:pointer}
.hero{position:relative;min-height:calc(100vh - 58px);display:flex;align-items:center;overflow:hidden}
.scene{position:absolute;inset:0;cursor:pointer}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 8%,transparent 62%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;pointer-events:none;width:100%}
.hero .wrap>*{pointer-events:auto;max-width:560px}
.who{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.who img{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid var(--blue)}
.who b{display:block;font:700 1.15rem "Bricolage Grotesque",sans-serif}
.who span{color:var(--muted);font-size:.95rem}
.hero h1{font:700 clamp(2.5rem,6.4vw,4.4rem)/1.08 "Space Grotesk",system-ui,sans-serif;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--amber)}
.sub{color:var(--muted);margin:22px 0 28px;font-size:1.1rem}
.hint{color:var(--muted);font-size:.85rem;margin-top:22px}
.btn{display:inline-block;background:var(--blue);color:#06101f;font-weight:500;padding:12px 22px;border-radius:6px;text-decoration:none;margin:0 10px 10px 0}
.btn.alt{background:none;color:var(--text);border:1px solid var(--line)}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.glow{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:32px;overflow:hidden;margin-bottom:28px;display:grid;grid-template-columns:220px 1fr;gap:40px}
.glow::before{content:"";position:absolute;inset:0;background:radial-gradient(380px circle at var(--x,50%) var(--y,0%),color-mix(in srgb,var(--blue) 18%,transparent),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.glow:hover::before{opacity:1}
.glow>*{position:relative}
.num{font:700 3.3rem/1 "Bricolage Grotesque",sans-serif;color:var(--blue)}
.num+p{color:var(--muted);font-size:.92rem;margin-top:8px}
.m{list-style:none;padding:0;margin:16px 0 0;font-size:.92rem;color:var(--muted)}
.m li{margin-bottom:4px}
.glow h3{font-size:1.45rem}
.role{color:var(--muted);margin:6px 0 16px}
.glow h4{font:500 1rem "IBM Plex Sans",sans-serif;margin:16px 0 6px}
.glow ul:not(.m){margin:0;padding-left:20px}
.glow li{margin-bottom:6px;max-width:66ch}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:56px}
.two ul{margin:0;padding:0;list-style:none}
.two li{padding:12px 0;border-top:1px solid var(--line)}
.two li b{display:block;font-weight:500}
.two li span{color:var(--muted);font-size:.95rem}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:12px 14px 12px 0;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:500;width:34%}
td{color:var(--muted)}
.tl{list-style:none;margin:0;padding:0 0 0 26px;border-left:2px solid var(--line)}
.tl li{position:relative;padding-bottom:30px}
.tl li::before{content:"";position:absolute;left:-33px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--blue);transition:background .3s}
.tl li:hover::before{background:var(--blue)}
.tl h3{font-size:1.15rem}
.tl .when{color:var(--muted);font-size:.9rem;margin:2px 0 6px}
.tl p{margin:0}
.about{display:grid;grid-template-columns:1fr 240px;gap:56px;align-items:start}
.about img{width:100%;border-radius:10px;border:1px solid var(--line);animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:.9rem}
@media(max-width:820px){.glow,.two,.about{grid-template-columns:1fr;gap:24px}.about img{max-width:220px}nav a.h{display:none}section{padding:60px 0}.hero::after{background:linear-gradient(0deg,var(--bg) 20%,transparent 100%)}}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.about img{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="bar"></div>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {useState,useEffect,useRef}=React;
const html=htm.bind(React.createElement);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

const WORK=[
{n:"~80",l:"less manual effort per review",f:["80% faster responses","9/10 expert score across 20 samples","Used for the top 20 executives"],
t:"Summarizing executive year-end reviews with GenAI",r:"Senior AI/ML Engineer at Accenture, for a global banking client",
p:"Reviewers read months of KPI data and dozens of feedback comments per executive before writing a review. Quality varied by reviewer and deadline, and these reviews shape promotion, pay and retention.",
b:["A pipeline turns KPI data and multi-source feedback into a structured summary of strengths, gaps and themes.","Every claim cites the KPI or comment behind it. Output follows a fixed schema, prompts are limited to the supplied data, and temperature 0 with a fixed seed keeps results repeatable.","Reviewers check every output and make the final call. Built with FastAPI, Azure OpenAI and Microsoft Agent Framework."],
h:"How I checked it",x:"An expert compared AI summaries with manual ones on 20 samples from the previous year, scoring quality, consistency and completeness: 9/10 on average. I chose a strict, evidence-linked format over fluent prose because reviewer trust mattered more than polish."},
{n:"~78",l:"less manual reporting",f:["7+ reports fully automated","5+ live dashboards","Two professional franchises"],
t:"Live performance analytics for cricket and volleyball teams",r:"Data Scientist at Invictus Performance Labs",
p:"Workload, training, match, fitness and recovery data sat in scattered spreadsheets. Analysts cleaned it by hand, often late at night, so coaches saw insights after the decision window had closed.",
b:["Staff entered data through Google Forms into Sheets. Apps Script and Python handled cleaning and automation, and Looker Studio served live dashboards. The teams already used Google Workspace, so nobody needed new tools.","Dashboards follow the questions coaches ask. One tracks each athlete's progress across bi-monthly assessments.","Missing entries are filled with that athlete's own median, so gaps do not distort individual trends."],
h:"The result",x:"Staff had numbers before training sessions instead of after, so they could tailor decisions to each athlete."},
{n:"96",l:"average accuracy across 20 invoices",f:["About 75% less manual extraction time","Low-confidence fields go to a person"],
t:"Automating invoice data extraction with LLMs",r:"Data Science Specialist, for a global banking client",
p:"An operations team keyed vendor, amount, date and bank details from many invoice layouts by hand. The work was slow, and each manual entry risked an error that would surface later as a payment issue or audit question.",
b:["Invoices go to Azure OpenAI with a Pydantic schema, so every output is typed and checkable. Custom validators, such as format checks on matter numbers, run automatically.","A second LLM scores confidence for each field. Low-confidence fields go to a person instead of passing through.","Validated output is saved as a CSV and uploaded in bulk by an RPA process, with no re-keying."],
h:"The result",x:"Accuracy averaged 96% against the data printed on 20 invoices, and the operations team no longer reviews every invoice."}];
const STR=[["Replacing manual work with automation","About 75% to 80% less manual effort across these projects."],["GenAI with guardrails","Structured outputs, citations, LLM-as-judge scoring and human review."],["Evaluating before shipping","Expert-scored samples and ground-truth checks."],["Building for non-technical users","Simple data capture and minimal dashboards."],["Operations and data science","Six years in risk and operations, then data and AI."]];
const TOOLS=[["Data and analytics","Python, pandas, SQL, Power BI, Looker Studio"],["GenAI and agents","Azure OpenAI, Microsoft Agent Framework, Copilot Studio, Pydantic structured outputs, LLM-as-judge evaluation"],["Backend and cloud","FastAPI, Azure"],["Automation","Power Automate, Google Apps Script, RPA integration"],["AI-assisted development","GitHub Copilot, Codex"],["Front end (working knowledge)","HTML, CSS, JavaScript, React"]];
const JOBS=[["Data Science Specialist, UBS","April 2026 to present","Built LLM-based invoice extraction with confidence-scored human review: about 75% less manual extraction time."],["Senior AI/ML Engineer, Accenture","September 2024 to April 2026","Shipped a GenAI summarizer for executive reviews, plus a FastAPI service that detects and removes PII in about 350 ms."],["Data Scientist, Invictus Performance Labs","June 2023 to May 2024","Built 5+ live dashboards for two professional franchises and automated 7+ reports."],["Data Scientist Lead, Zummit Infolab","January 2023 to April 2023","Led 30 interns to deliver 10 deployable ML models and fine-tuned a DistilBERT next-word model to 90% accuracy."],["Senior Risk Analyst, Amazon","February 2016 to September 2022","Cut SOP working time by 20% through data analysis and mentored 25 analysts to 95% productivity and a 98% quality rating."]];

function useInView(){const ref=useRef();const[v,setV]=useState(reduce);useEffect(()=>{if(reduce)return;const o=new IntersectionObserver(([e])=>{if(e.isIntersecting){setV(true);o.disconnect()}},{threshold:.15});o.observe(ref.current);return()=>o.disconnect()},[]);return[ref,v]}
function Reveal({children}){const[ref,v]=useInView();return html`<div ref=${ref} class=${"rv"+(v?" in":"")}>${children}</div>`}
const glow=e=>{const r=e.currentTarget.getBoundingClientRect();e.currentTarget.style.setProperty("--x",e.clientX-r.left+"px");e.currentTarget.style.setProperty("--y",e.clientY-r.top+"px")};

function Scene(){
  const ref=useRef();
  useEffect(()=>{
    const el=ref.current;let renderer;
    try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true})}catch(e){return}
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));el.appendChild(renderer.domElement);
    const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(48,1,.1,100);cam.position.set(0,3.5,15);cam.lookAt(0,0,0);
    const G=28,N=G*G,chaos=new Float32Array(N*3),order=new Float32Array(N*3),pos=new Float32Array(N*3),col=new Float32Array(N*3);
    for(let i=0;i<G;i++)for(let j=0;j<G;j++){
      const k=(i*G+j)*3,x=(i-G/2)*.55,z=(j-G/2)*.55;
      order[k]=x;order[k+2]=z;order[k+1]=Math.sin(x*.9)*Math.cos(z*.9)*1.3+Math.exp(-(x*x+z*z)/18)*2.2-1;
      const u=Math.random()*6.283,v=Math.acos(2*Math.random()-1),rr=4+Math.random()*7;
      chaos[k]=rr*Math.sin(v)*Math.cos(u);chaos[k+1]=rr*Math.sin(v)*Math.sin(u)*.7;chaos[k+2]=rr*Math.cos(v);
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute("position",new THREE.BufferAttribute(pos,3));geo.setAttribute("color",new THREE.BufferAttribute(col,3));
    const cv=document.createElement("canvas");cv.width=cv.height=64;const cx=cv.getContext("2d");cx.beginPath();cx.arc(32,32,30,0,6.283);cx.fillStyle="#fff";cx.fill();const tex=new THREE.CanvasTexture(cv);
    const pts=new THREE.Points(geo,new THREE.PointsMaterial({size:.17,map:tex,alphaTest:.5,vertexColors:true,transparent:true,opacity:.95,depthWrite:false}));
    scene.add(pts);
    const A=new THREE.Color("#ffb454"),B=new THREE.Color("#6aa5ff"),C=new THREE.Color();
    let p=reduce?1:0,tgt=1,mx=0,my=0,id;const t0=performance.now();
    const size=()=>{const w=el.clientWidth,h=el.clientHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();pts.position.x=w<820?0:4.4;pts.position.y=w<820?3:0};
    size();addEventListener("resize",size);
    const move=e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5};addEventListener("pointermove",move);
    const click=()=>{tgt=tgt?0:1};el.addEventListener("click",click);
    const frame=now=>{
      const t=(now-t0)/1000;p+=(tgt-p)*(reduce?1:.025);const e=p*p*(3-2*p);
      for(let i=0;i<N;i++){
        const k=i*3;
        pos[k]=chaos[k]+(order[k]-chaos[k])*e;pos[k+2]=chaos[k+2]+(order[k+2]-chaos[k+2])*e;
        pos[k+1]=chaos[k+1]+(order[k+1]-chaos[k+1])*e+Math.sin(t*1.4+order[k]*.8+order[k+2]*.6)*.22*e+Math.sin(t+i)*.08*(1-e);
        C.copy(A).lerp(B,Math.min(1,e*(.55+(order[k+1]+1.2)/4)));col[k]=C.r;col[k+1]=C.g;col[k+2]=C.b;
      }
      geo.attributes.position.needsUpdate=true;geo.attributes.color.needsUpdate=true;
      pts.rotation.y=reduce?.5:t*.12+mx*.6;pts.rotation.x=my*.25;
      renderer.render(scene,cam);id=requestAnimationFrame(frame);
    };
    id=requestAnimationFrame(frame);
    return()=>{cancelAnimationFrame(id);removeEventListener("resize",size);removeEventListener("pointermove",move);el.removeEventListener("click",click);geo.dispose();tex.dispose();renderer.dispose();if(renderer.domElement.parentNode===el)el.removeChild(renderer.domElement)};
  },[]);
  return html`<div class="scene" ref=${ref} aria-hidden="true"></div>`;
}

function App(){
  useEffect(()=>{
    const bar=document.getElementById("bar");
    const on=()=>{bar.style.transform="scaleX("+scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight)+")"};
    on();addEventListener("scroll",on,{passive:true});return()=>removeEventListener("scroll",on);
  },[]);
  const toggle=()=>{
    const root=document.documentElement,cur=root.getAttribute("data-theme");
    const dark=cur?cur==="dark":!matchMedia("(prefers-color-scheme: light)").matches;
    const next=dark?"light":"dark";root.setAttribute("data-theme",next);
    try{localStorage.setItem("theme",next)}catch(e){}
  };
  return html`<${React.Fragment}>
  <header><div class="wrap"><nav>
    <a class="name" href="#top">Shubham Wankar</a>
    <a class="h" href="#work">Work</a><a class="h" href="#skills">Skills</a><a class="h" href="#experience">Experience</a><a class="h" href="#about">About</a><a class="h" href="#contact">Contact</a>
    <button id="theme" type="button" onClick=${toggle} aria-label="Switch between dark and light theme">Theme</button>
  </nav></div></header>
  <main id="top">
    <div class="hero"><${Scene}/>
      <div class="wrap">
        <div class="who"><img src="IMG_3225.JPG" alt="Portrait of Shubham Wankar"/><div><b>Shubham Wankar</b><span>Senior Data Scientist, 9+ Years</span></div></div>
        <h1>Turning <em>messy data</em> into insights and impact</h1>
        <p class="sub">I build analytics and GenAI systems that replace manual work with something people trust.</p>
        <a class="btn" href="Shubham_Wankar_Resume.pdf" download>Download resume</a><a class="btn alt" href="#work">See the work</a>
        <p class="hint">Click the dots to scramble them, then watch them settle into order again.</p>
      </div>
    </div>
    <section id="work"><div class="wrap"><h2>Selected work</h2>
      ${WORK.map(w=>html`<${Reveal}><article class="glow" onMouseMove=${glow}>
        <div><div class="num">${w.n}%</div><p>${w.l}</p><ul class="m">${w.f.map(x=>html`<li>${x}</li>`)}</ul></div>
        <div><h3>${w.t}</h3><p class="role">${w.r}</p>
          <h4>The problem</h4><p>${w.p}</p>
          <h4>What I built</h4><ul>${w.b.map(x=>html`<li>${x}</li>`)}</ul>
          <h4>${w.h}</h4><p>${w.x}</p></div>
      </article><//>`)}
    </div></section>
    <section id="skills"><div class="wrap"><h2>Skills</h2><div class="two">
      <ul>${STR.map(s=>html`<li><b>${s[0]}</b><span>${s[1]}</span></li>`)}</ul>
      <table><tbody>${TOOLS.map(t=>html`<tr><th>${t[0]}</th><td>${t[1]}</td></tr>`)}</tbody></table>
    </div></div></section>
    <section id="experience"><div class="wrap"><h2>Experience</h2>
      <ol class="tl">${JOBS.map(j=>html`<li><h3>${j[0]}</h3><div class="when">${j[1]}</div><p>${j[2]}</p></li>`)}</ol>
    </div></section>
    <section id="about"><div class="wrap about"><div><h2>About</h2>
      <p>I'm a data scientist with 9+ years of experience. The first six were in risk and operations at Amazon, and the years since have gone into building data and GenAI systems. That background shapes how I work: I start with the process and the people who live with it, then build the simplest solution they'll trust.</p>
      <p>Recently that has meant production GenAI for a global banking client, including summarizing executive performance reviews and extracting invoice data, always with citations, structured outputs and human review where the model is least certain. Before that I built analytics for professional sports teams, where a dashboard only matters if a coach can use it before training starts.</p>
      <p>I hold a Master's in Data Science from Liverpool John Moores University.</p></div>
      <img src="AI-Avatar.png" alt="Illustrated avatar of Shubham Wankar"/></div></section>
    <section id="contact"><div class="wrap"><h2>Get in touch</h2>
      <p>Hiring for a senior data or analytics role, or want to talk about a problem? Email me or find me on LinkedIn.</p>
      <a class="btn" href="mailto:shubhamwankar23@gmail.com">Email me</a><a class="btn alt" href="https://linkedin.com/in/shubham-wankar">LinkedIn</a><a class="btn alt" href="https://github.com/shubhamwankar">GitHub</a>
    </div></section>
  </main>
  <footer><div class="wrap">© 2026 Shubham Wankar</div></footer>
  <//>`;
}
try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
