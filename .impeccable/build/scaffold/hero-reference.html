<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: modern-precision-approved-css.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu+Sans:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f1f8f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:390px">
  <div class="r-brand region text" data-region="brand"><!-- Portfolio name in bold navy sans serif --><p style="font-size:var(--r-brand-font);line-height:1.05;margin:0">brand</p></div>
  <div class="r-menu region control" data-region="menu"><!-- Navy mobile menu icon: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop menu); a control need not have button chrome --></div>
  <div class="r-expertise region text" data-region="expertise"><!-- Steel blue expertise text --><p style="font-size:var(--r-expertise-font);line-height:1.05;margin:0">expertise</p></div>
  <div class="r-headline region text" data-region="headline"><!-- Bold navy heading Building AI that works in production. --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-intro region text" data-region="intro"><!-- Two lines of steel blue supporting text --><p style="font-size:var(--r-intro-font);line-height:1.05;margin:0">intro</p></div>
  <div class="r-resume region control" data-region="resume"><!-- Solid teal resume link with white text and arrow: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop resume); a control need not have button chrome --></div>
  <div class="r-contact region control" data-region="contact"><!-- Teal outlined contact link: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop contact); a control need not have button chrome --></div>
  <div class="r-hero-rule region chrome" data-region="hero-rule"><!-- Thin blue gray horizontal divider --></div>
  <div class="r-feature region chrome" data-region="feature"><!-- Flat pale blue feature section background --></div>
  <div class="r-feature-label region text" data-region="feature-label"><!-- Featured work label in steel blue --><p style="font-size:var(--r-feature-label-font);line-height:1.05;margin:0">feature-label</p></div>
  <div class="r-feature-title region text" data-region="feature-title"><!-- Executive evaluation heading in navy --><p style="font-size:var(--r-feature-title-font);line-height:1.05;margin:0">feature-title</p></div>
  <div class="r-feature-desc region text" data-region="feature-desc"><!-- Two line AI microservice description --><p style="font-size:var(--r-feature-desc-font);line-height:1.05;margin:0">feature-desc</p></div>
  <div class="r-previous-label region text" data-region="previous-label"><!-- Previous service label --><p style="font-size:var(--r-previous-label-font);line-height:1.05;margin:0">previous-label</p></div>
  <div class="r-previous-value region text" data-region="previous-value"><!-- About eight minute processing time --><p style="font-size:var(--r-previous-value-font);line-height:1.05;margin:0">previous-value</p></div>
  <div class="r-comparison-arrow region control" data-region="comparison-arrow"><!-- Right arrow separating processing times: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop comparison-arrow); a control need not have button chrome --></div>
  <div class="r-new-label region text" data-region="new-label"><!-- New service label --><p style="font-size:var(--r-new-label-font);line-height:1.05;margin:0">new-label</p></div>
  <div class="r-new-value region text" data-region="new-value"><!-- Under one minute processing time in teal --><p style="font-size:var(--r-new-value-font);line-height:1.05;margin:0">new-value</p></div>
  <div class="r-scope-label region text" data-region="scope-label"><!-- Scope label --><p style="font-size:var(--r-scope-label-font);line-height:1.05;margin:0">scope-label</p></div>
  <div class="r-scope region text" data-region="scope"><!-- Twenty executives supported --><p style="font-size:var(--r-scope-font);line-height:1.05;margin:0">scope</p></div>
  <div class="r-result-label region text" data-region="result-label"><!-- Result label --><p style="font-size:var(--r-result-label-font);line-height:1.05;margin:0">result-label</p></div>
  <div class="r-result region text" data-region="result"><!-- Qualitative evaluation consistency result --><p style="font-size:var(--r-result-font);line-height:1.05;margin:0">result</p></div>
  <div class="r-case-link region control" data-region="case-link"><!-- Teal case study link with arrow: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop case-link); a control need not have button chrome --></div>
  <div class="r-projects-rule region chrome" data-region="projects-rule"><!-- Thin horizontal section divider --></div>
  <div class="r-projects-label region text" data-region="projects-label"><!-- Selected projects label --><p style="font-size:var(--r-projects-label-font);line-height:1.05;margin:0">projects-label</p></div>
  <div class="r-projects-title region text" data-region="projects-title"><!-- Selected projects heading --><p style="font-size:var(--r-projects-title-font);line-height:1.05;margin:0">projects-title</p></div>
  <div class="r-project-one region text" data-region="project-one"><!-- Text to SQL project title --><p style="font-size:var(--r-project-one-font);line-height:1.05;margin:0">project-one</p></div>
  <div class="r-project-one-tech region text" data-region="project-one-tech"><!-- Technology list for Text to SQL --><p style="font-size:var(--r-project-one-tech-font);line-height:1.05;margin:0">project-one-tech</p></div>
  <div class="r-project-one-link region control" data-region="project-one-link"><!-- Project repository arrow: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop project-one-link); a control need not have button chrome --></div>
  <div class="r-project-rule region chrome" data-region="project-rule"><!-- Thin project divider --></div>
  <div class="r-project-two region text" data-region="project-two"><!-- Next word prediction project title --><p style="font-size:var(--r-project-two-font);line-height:1.05;margin:0">project-two</p></div>
  <div class="r-project-two-tech region text" data-region="project-two-tech"><!-- Technology list for next word prediction --><p style="font-size:var(--r-project-two-tech-font);line-height:1.05;margin:0">project-two-tech</p></div>
  <div class="r-project-two-link region control" data-region="project-two-link"><!-- Project repository arrow: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop project-two-link); a control need not have button chrome --></div>
  <div class="r-header region chrome" data-region="header"><!-- Header containing name and mobile navigation --></div>
  <div class="r-hero region chrome" data-region="hero"><!-- Introduction containing expertise heading copy and actions --></div>
  <div class="r-project-list region chrome" data-region="project-list"><!-- Project section containing its headings and individual project rows --></div>
</main>
</body>
</html>
